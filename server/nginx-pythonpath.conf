# pythonpath.ir: the site from /var/www/pythonpath, and /api/skin from roja-api.service.
# Installed by tools/deploy.sh as /etc/nginx/sites-enabled/pythonpath. The certificate
# is Let's Encrypt's, renewed through the web root:
#   certbot certonly --webroot -w /var/www/pythonpath -d pythonpath.ir -d www.pythonpath.ir
#
# No http2 here: on nginx 1.24 it is set per address and would change the other sites
# on this port too.

limit_req_zone $binary_remote_addr zone=roja_api:1m rate=30r/m;

# The page, the service worker and the modules are checked with the server on every
# load (a cheap 304 when unchanged), so a release is picked up at once; the face model,
# its runtime, the font and the icons change rarely.
map $uri $roja_cache {
    ~^/(vendor|fonts|icons)/  "public, max-age=604800";
    ~^/api/                   "no-store";
    default                   "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name pythonpath.ir www.pythonpath.ir;
    location /.well-known/acme-challenge/ { root /var/www/pythonpath; }
    location / { return 301 https://pythonpath.ir$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.pythonpath.ir;
    ssl_certificate /etc/letsencrypt/live/pythonpath.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pythonpath.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://pythonpath.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pythonpath.ir;
    ssl_certificate /etc/letsencrypt/live/pythonpath.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pythonpath.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Behind Cloudflare's proxy, the visitor's address comes in CF-Connecting-IP; trusted
    # from Cloudflare's ranges only (https://www.cloudflare.com/ips/), so the API's rate
    # limit is per visitor. Without the proxy these lines change nothing.
    set_real_ip_from 173.245.48.0/20;  set_real_ip_from 103.21.244.0/22;  set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;    set_real_ip_from 141.101.64.0/18;  set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;  set_real_ip_from 188.114.96.0/20;  set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;  set_real_ip_from 162.158.0.0/15;   set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;    set_real_ip_from 172.64.0.0/13;    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;   set_real_ip_from 2606:4700::/32;   set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;   set_real_ip_from 2405:8100::/32;   set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    root /var/www/pythonpath;
    index index.html;
    charset utf-8;
    charset_types text/css text/javascript application/javascript application/json application/manifest+json;
    gzip on;
    gzip_vary on;
    gzip_types application/wasm application/octet-stream application/javascript text/javascript text/css image/svg+xml application/json application/manifest+json;

    # Set here once; no location below adds headers of its own, so all of them apply.
    add_header Cache-Control $roja_cache always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;

    location / { try_files $uri $uri/ =404; }
    # Certificate renewal (certbot --webroot), also when Cloudflare sends it over HTTPS.
    location ^~ /.well-known/acme-challenge/ { default_type text/plain; }
    location ~ \.mjs$ { types { text/javascript mjs; } }
    location ~ \.wasm$ { types { application/wasm wasm; } }
    location = /manifest.webmanifest { types { application/manifest+json webmanifest; } }
    location ~ /\. { deny all; }

    # Anonymous usage counts. No access log: not even nginx keeps who sent them.
    location = /api/stats {
        limit_req zone=roja_api burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:51840;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        proxy_hide_header Cache-Control;
        access_log off;
    }

    location /api/skin {
        limit_req zone=roja_api burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:51840;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        proxy_hide_header Cache-Control;
        access_log off;
    }
}
