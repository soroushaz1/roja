# The before/after pictures for the site (showcase/): faces made by an image model on
# Vertex AI in the Google Cloud project (no real person), shown bare and then with
# Roja's looks or Roja Clinic's procedures by the mirrors' own renderers, every picture
# saying it is a simulation on a face made by AI. See tools/showcase/.
#
# Runs when tools/showcase/faces.json changes on main, or by hand. The faces it makes
# go to the branch too (tools/showcase/faces/), so a later run uses the same people. Signs in to Google
# Cloud the same keyless way as the real-devices job in android.yml (its repository
# variables), and pushes the pictures to a branch of their own, showcase-<run>, to be
# looked at and merged like any other change: nothing reaches the site by itself.
name: Showcase pictures

on:
  push:
    branches: [main]
    paths: ['tools/showcase/faces.json']
  workflow_dispatch:

concurrency:
  group: showcase
  cancel-in-progress: false

jobs:
  pictures:
    name: Make the before/after pictures
    if: github.ref == 'refs/heads/main' && vars.ROJA_GCP_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: soroushaz1/roja-clinic
          path: clinic
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.ROJA_GCP_PROJECT }}
          workload_identity_provider: ${{ vars.ROJA_GCP_PROVIDER }}
          service_account: ${{ vars.ROJA_GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: The faces
        env:
          ROJA_GCP_PROJECT: ${{ vars.ROJA_GCP_PROJECT }}
        run: |
          gcloud services enable aiplatform.googleapis.com --project "$ROJA_GCP_PROJECT"
          GCP_TOKEN=$(gcloud auth print-access-token) node tools/showcase/make-faces.mjs

      - name: Playwright
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: The pictures
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
        run: |
          node tools/preview.cjs & PORT=4174 node clinic/tools/preview.cjs &
          sleep 2
          rm -rf showcase && node tools/showcase/render.cjs tools/showcase/faces showcase

      - name: To a branch of their own
        run: |
          branch=showcase-${{ github.run_number }}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add showcase tools/showcase/faces
          git commit -q -m "Before/after pictures, made by the Showcase workflow (run ${{ github.run_number }})"
          git push -q origin "$branch"
          echo "pushed $branch: $(ls showcase/*.jpg | wc -l) pictures" | tee -a "$GITHUB_STEP_SUMMARY"
